[project]
name = "custops"
version = "0.1.0"
description = "AI Customer Operations Orchestrator — agentic platform for B2B SaaS customer operations"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary" }

# Phase 1 dependencies only. Orchestration (langgraph), tool protocol (mcp),
# agent-to-agent (a2a-sdk), browser automation (playwright), the CrewAI
# comparison, the evaluation platform and every model-provider SDK arrive in
# their own phase. See docs/BUILD_SPEC.md §20. Rules 7 and 8: nothing is
# installed before it has a job.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "structlog>=24.4",
    "pgvector>=0.5.0",
    "mcp>=2.0.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.3.4",
    "playwright>=1.62.0",
    "a2a-sdk>=1.1.2",
]

[project.scripts]
custops = "custops.cli:main"
# The Billing Specialist is a separate process (D6), so it gets its own entry
# point rather than a flag on the API. Started independently, it needs
# PostgreSQL and nothing else in the platform.
custops-billing-specialist = "custops.apps.billing_specialist.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "crewai>=1.6.1",
    "agent-forge",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/custops"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires a live PostgreSQL and/or Redis instance; skipped automatically when unreachable",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "ANN",  # flake8-annotations (Rule 11: type hints throughout)
    "ASYNC",
    "RUF",
]
ignore = [
    "ANN401", # allow typing.Any in narrow, documented places
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN001", "ANN201", "S101"]
"migrations/**" = ["ANN001", "ANN201", "INP001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "benchmarks"]

[[tool.mypy.overrides]]
# Alembic's generated env/templates are not part of the typed surface.
module = "migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
# asyncpg ships no type stubs. It is used directly only by the integration
# probe; the application reaches it through SQLAlchemy, which is typed.
module = ["asyncpg.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# agent-forge v0.1.0 ships no py.typed marker, so mypy declines to read its
# annotations even though the source is fully typed. Worth fixing in AgentForge
# rather than working around here; until then this is the same accommodation
# the project already makes for asyncpg. The evaluation layer is dev-only, so
# no production module loses type coverage because of it.
module = ["agent_forge.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Provider SDKs are optional at import time — the adapters import them lazily
# and raise an actionable error when absent (see providers/*_provider.py), so
# type-checking must not require them to be installed.
module = ["openai.*", "google.*", "google.genai.*"]
ignore_missing_imports = true

[tool.uv.sources]
agent-forge = { git = "https://github.com/Harikrishnan006/agent-forge", rev = "v0.1.0" }
